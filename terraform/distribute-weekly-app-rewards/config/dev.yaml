---
# AWS Configuration
aws_region: eu-west-1
aws_account_id: "211125319139"
environment: "testnet"

# Lambda Configuration
lambda_function_name: "distribute-weekly-app-rewards"
lambda_handler: "index.handler"
lambda_runtime: "nodejs20.x"
lambda_memory_size: 512
lambda_timeout: 900

# Lambda Build Path
lambda_source_dir: "packages/lambda/dist/testnet-staging/distributeWeeklyAppRewards"

# Schedule Configuration
# 5 minutes after start-emissions-round (cron(30 1 ? * TUE,THU,SAT *))
schedule_expression: "cron(35 1 ? * TUE,THU,SAT *)"
# Catch-up runs every 10 min (2:05-7:55 UTC), offset 5 min after the start-emissions-round
# catch-up runs. The lambda skips idempotently while the round is pending / after distribution.
catchup_schedule_expression: "cron(5/10 2-7 ? * TUE,THU,SAT *)"
