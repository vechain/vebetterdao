project_name: b3tr-frontend
project_slug: governance-frontend
environment: dev
region: eu-west-1
account_id: "211125319139"

account_level_state_region: eu-west-1

domain: dev.testnet.governance.vebetterdao.org
enable_custom_domain: true
route53_zone_name: testnet.governance.vebetterdao.org

ssm_parameter_prefix: /b3tr/frontend/dev-testnet/
runtime_env_var_names: []
runtime_env_secret_names: []

# NEXT_PUBLIC_* values are injected into App Runner runtime env; the frontend
# reads them at request time via window.__ENV__. All are client-visible IDs.
# NEXT_PUBLIC_APP_VERSION is derived from image_tag by terraform (not here).
runtime_env_vars_inline:
  NEXT_PUBLIC_APP_ENV: testnet
  NEXT_PUBLIC_DELEGATOR_URL: ""
  NEXT_PUBLIC_MIXPANEL_PROJECT_TOKEN: ""
  NEXT_PUBLIC_PRIVY_APP_ID: ""
  NEXT_PUBLIC_PRIVY_CLIENT_ID: ""
  NEXT_PUBLIC_TRANSAK_API_KEY: ""
  NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ""

image_tag: dev-latest
cpu: 1024
memory: 2048
port: 3000
min_size: 1
max_size: 2
max_concurrency: 50
health_check_path: /
node_env: dev
auto_deployments_enabled: false
