---
# AWS Configuration
aws_region: eu-west-1
aws_account_id: "851725442887"
environment: "mainnet"

# Lambda Configuration
lambda_function_name: "start-emissions-round"
lambda_handler: "index.handler"
lambda_runtime: "nodejs20.x"
lambda_memory_size: 512
lambda_timeout: 900

# Lambda Build Path
lambda_source_dir: "packages/lambda/dist/mainnet/startEmissionsRound"

# Schedule Configuration
schedule_expression: "cron(45 6 ? * MON *)" # Runs every Monday at 6:45 AM UTC
# Catch-up runs every 10 min (7:00-12:50 UTC) to absorb the weekly wall-clock drift of the
# cycle start block. The lambda skips idempotently once the round has started.
catchup_schedule_expression: "cron(0/10 7-12 ? * MON *)"
