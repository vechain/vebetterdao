version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    ignore:
      # ts-node/typechain/openapi-typescript/@typescript-eslint don't support TS 7 yet
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    ignore:
      # engines.node is 22.x
      - dependency-name: "node"
        versions: [">=23"]
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
