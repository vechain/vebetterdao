version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    ignore:
      # TS 7 (rewritten "corsa" compiler) is not yet supported by
      # ts-node, typechain, openapi-typescript, and @typescript-eslint.
      # Revisit when those tools ship TS-7-compatible releases.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    pull-request-branch-name:
      separator: "-"
    labels:
      - dependencies
      - increment:patch
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      docker-major:
        patterns:
          - "*"
        update-types:
          - major
