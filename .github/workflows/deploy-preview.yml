name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# Only allow one preview deployment per PR at a time
# New commits cancel any in-progress runs for the same PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Preview deploys are gated by the `create-preview` label. Removing the label
# is intentionally a no-op (preview keeps running until PR close). Builds for
# every PR push live in build-fe-image.yml — this workflow never builds.

env:
  # AWS Configuration
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: governance-frontend
  TERRAFORM_VERSION: 1.10.0

  # Project Configuration
  PROJECT_NAME: Governance Frontend
  BASE_DOMAIN: governance.vebetterdao.org

  # Terraform Paths
  TERRAFORM_DIR: terraform/frontend/frontend-env-level
  TERRAFORM_ENV_DIR: terraform/frontend/environments/env
  TERRAFORM_BACKEND_CONFIG: ../environments/env/preview/backend.config

jobs:
  # Preview runs when: (a) PR carries the `create-preview` label AND
  # (b) the PR touches paths that affect the frontend or preview Terraform.
  preview-relevant:
    name: Preview relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_preview: ${{ steps.gate.outputs.run_preview }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            paths_relevant:
              - 'apps/**'
              - 'packages/**'
              - 'terraform/**'
              - 'Dockerfile*'
              - 'package.json'
              - 'yarn.lock'
              - 'turbo.json'
              - '.github/workflows/deploy*.yml'
              - '.github/workflows/destroy*.yml'
              - '.github/workflows/build-fe-image.yml'
      - name: Combine label + paths gate
        id: gate
        env:
          PATHS_RELEVANT: ${{ steps.filter.outputs.paths_relevant }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'create-preview') }}
        run: |
          if [ "${PATHS_RELEVANT}" = "true" ] && [ "${HAS_LABEL}" = "true" ]; then
            echo "run_preview=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview will deploy (create-preview label present, PR touches preview-relevant paths)."
          else
            echo "run_preview=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview skipped (label=${HAS_LABEL}, paths_relevant=${PATHS_RELEVANT})."
          fi

  # Determine which flavors to deploy based on target branch
  setup:
    name: Setup
    needs: [preview-relevant]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flavors: ${{ steps.determine.outputs.flavors }}
      pr_number: ${{ steps.determine.outputs.pr_number }}
      short_sha: ${{ steps.determine.outputs.short_sha }}
      run_url: ${{ steps.determine.outputs.run_url }}
    steps:
      - name: Determine flavors and metadata
        id: determine
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "run_url=$RUN_URL" >> $GITHUB_OUTPUT

          if [ "$BASE_REF" == "main" ]; then
            echo 'flavors=["staging", "beta"]' >> $GITHUB_OUTPUT
            echo "::notice::PR to main - deploying staging + beta previews"
          else
            echo "::error::Unsupported base branch: ${BASE_REF}"
            exit 1
          fi

  # Post initial "deploying" comment in PR
  preview-start-comment:
    name: Preview start comment
    needs: [setup, preview-relevant]
    if: needs.preview-relevant.outputs.run_preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update PR comment - Deploying
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLAVORS: ${{ needs.setup.outputs.flavors }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          RUN_URL: ${{ needs.setup.outputs.run_url }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        with:
          script: |
            const flavors = JSON.parse(process.env.FLAVORS);
            const prNumber = process.env.PR_NUMBER;
            const shortSha = process.env.SHORT_SHA;
            const runUrl = process.env.RUN_URL;
            const projectName = process.env.PROJECT_NAME;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;

            let rows = '';
            for (const flavor of flavors) {
              rows += `| **${flavor}** | 🚀 Deploying ([${shortSha}](${commitUrl})) | Promoting image + applying terraform... | [View Logs →](${runUrl}) |\n`;
            }

            const commentBody = [
              `## ${projectName} – Preview`,
              '',
              '| Name | Status | Preview | Updated (UTC) |',
              '|------|--------|---------|---------------|',
              rows.trim(),
              '',
              '---',
              `<sub>Deploying commit ${shortSha} • Preview environments are automatically destroyed when PRs are closed</sub>`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
            });

            const existingComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes(`${projectName} – Preview`)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: commentBody
              });
            }

  # Verify the SHA image exists in GHCR (built by build-fe-image.yml on this PR
  # push). Never builds. Waits up to 15 min for the parallel build to finish.
  verify-image:
    name: Verify GHCR image
    needs: [setup, preview-start-comment, preview-relevant]
    if: needs.preview-relevant.outputs.run_preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Wait for GHCR image at PR head SHA
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker buildx imagetools inspect "${GHCR_IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
              echo "Found ${GHCR_IMAGE}:${SHA_TAG} on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/30: ${GHCR_IMAGE}:${SHA_TAG} not present yet; sleeping 30s..."
            sleep 30
          done
          echo "::error::Timed out waiting for ${GHCR_IMAGE}:${SHA_TAG}. build-fe-image.yml may have failed."
          exit 1

  # Instant-success stand-in when preview is not needed (path-filter or missing label)
  verify-image-skip:
    name: Verify GHCR image
    needs: [setup, preview-relevant]
    if: needs.preview-relevant.outputs.run_preview != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip verify (preview not needed)
        run: echo "::notice::Preview not deploying — skipping image verification."

  # Deploy preview environment for each flavor
  deploy:
    name: Deploy Preview (${{ matrix.flavor }})
    needs: [setup, verify-image, preview-relevant]
    if: needs.preview-relevant.outputs.run_preview == 'true' && always() && needs.verify-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    # Match the flavor's GitHub environment so vars.NEXT_PUBLIC_* are visible
    # to the runtime-env forwarding step below.
    environment: ${{ matrix.flavor }}
    strategy:
      matrix:
        flavor: [staging, beta]
      fail-fast: false
    outputs:
      # Store URLs and status for each flavor using dynamic keys
      custom_url_staging: ${{ steps.save-urls.outputs.custom_url_staging }}
      service_url_staging: ${{ steps.save-urls.outputs.service_url_staging }}
      status_staging: ${{ steps.save-urls.outputs.status_staging }}
      custom_url_beta: ${{ steps.save-urls.outputs.custom_url_beta }}
      service_url_beta: ${{ steps.save-urls.outputs.service_url_beta }}
      status_beta: ${{ steps.save-urls.outputs.status_beta }}
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.DEV_AWS_ACC_ROLE }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote GHCR → ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${SHA_TAG}" >/dev/null 2>&1; then
            echo "ECR ${ECR_IMAGE}:${SHA_TAG} already present — skipping copy."
          else
            echo "Copying ${GHCR_IMAGE}:${SHA_TAG} → ${ECR_IMAGE}:${SHA_TAG}"
            docker buildx imagetools create --tag "${ECR_IMAGE}:${SHA_TAG}" "${GHCR_IMAGE}:${SHA_TAG}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install yq
        env:
          YQ_VERSION: v4.53.2
        run: |
          set -euo pipefail
          YQ_BIN="${HOME}/.local/bin/yq"
          mkdir -p "$(dirname "${YQ_BIN}")"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o "${YQ_BIN}"
          chmod +x "${YQ_BIN}"
          echo "$(dirname "${YQ_BIN}")" >> "${GITHUB_PATH}"
          yq --version

      - name: Create preview environment config
        id: preview_config
        run: |
          # Get values
          PR_NUMBER="${{ needs.setup.outputs.pr_number }}"
          SHORT_SHA="${{ needs.setup.outputs.short_sha }}"
          FLAVOR="${{ matrix.flavor }}"

          # Define paths
          WORKSPACE_NAME="preview-pr-${PR_NUMBER}-${FLAVOR}"
          # Both preview flavors pull the same env-agnostic image from ECR.
          # The image is content-addressed by full commit SHA (matches GHCR).
          IMAGE_TAG="${SHA_TAG}"
          SOURCE_CONFIG="${{ env.TERRAFORM_ENV_DIR }}/${FLAVOR}/${FLAVOR}.yaml"
          TARGET_DIR="${{ env.TERRAFORM_ENV_DIR }}/${WORKSPACE_NAME}"
          TARGET_FILE="${TARGET_DIR}/${WORKSPACE_NAME}.yaml"

          # Extract route53_zone_name from source environment to construct correct domain
          if [ -f "${SOURCE_CONFIG}" ]; then
            ROUTE53_ZONE=$(yq eval '.route53_zone_name' "${SOURCE_CONFIG}")
            # Construct preview domain: pr-{PR}-{FLAVOR}.{FLAVOR}.{ZONE}
            PREVIEW_DOMAIN="pr-${PR_NUMBER}-${FLAVOR}.${FLAVOR}.${ROUTE53_ZONE}"
          else
            echo "::error::Source config ${SOURCE_CONFIG} not found."
            exit 1
          fi

          echo "=== Preview Config Generation ==="
          echo "PR Number: ${PR_NUMBER}"
          echo "Short SHA: ${SHORT_SHA}"
          echo "Flavor: ${FLAVOR}"
          echo "Route53 Zone: ${ROUTE53_ZONE}"
          echo "Preview Domain: ${PREVIEW_DOMAIN}"
          echo "Image Tag: ${IMAGE_TAG}"
          echo "Source Config: ${SOURCE_CONFIG}"
          echo "Target File: ${TARGET_FILE}"
          echo ""

          # Step 1: Create workspace directory
          mkdir -p "${TARGET_DIR}"

          # Step 2: Copy the preview template
          cp "${{ env.TERRAFORM_ENV_DIR }}/preview/preview.yaml.example" "${TARGET_FILE}"

          # Step 3: Replace placeholders in the template
          sed -i "s/{PR_NUMBER}/${PR_NUMBER}-${FLAVOR}/g" "${TARGET_FILE}"
          sed -i "s/{COMMIT_SHA}/${SHORT_SHA}/g" "${TARGET_FILE}"

          # Step 4: Override the domain with the correctly constructed one
          sed -i "s|^domain:.*|domain: ${PREVIEW_DOMAIN}|g" "${TARGET_FILE}"

          # Step 5: Append flavor-specific config from source environment
          echo "" >> "${TARGET_FILE}"
          echo "# ============================================" >> "${TARGET_FILE}"
          echo "# Dynamic Config from ${FLAVOR} flavor" >> "${TARGET_FILE}"
          echo "# ============================================" >> "${TARGET_FILE}"

          # Override image tag
          echo "image_tag: ${IMAGE_TAG}" >> "${TARGET_FILE}"

          # Extract and append SSM config from source environment
          echo "Extracting config from ${SOURCE_CONFIG}..."

          # Extract ssm_parameter_prefix, route53_zone_name, runtime_env_var_names,
          # runtime_env_secret_names, and runtime_env_vars_inline (NEXT_PUBLIC_* etc.)
          yq eval '{
            "ssm_parameter_prefix": .ssm_parameter_prefix,
            "route53_zone_name": .route53_zone_name,
            "runtime_env_var_names": (.runtime_env_var_names // []),
            "runtime_env_secret_names": (.runtime_env_secret_names // []),
            "runtime_env_vars_inline": (.runtime_env_vars_inline // {})
          } | del(.ssm_parameter_prefix | select(. == null))' "${SOURCE_CONFIG}" >> "${TARGET_FILE}"

          # Step 6: Show the generated config for debugging
          echo ""
          echo "=== Generated Preview Config ==="
          cat "${TARGET_FILE}"

          # Exposed for the collect step's BASE_PATH override.
          echo "preview_domain=${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Collect NEXT_PUBLIC_* runtime env vars
        id: next_public
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          PREVIEW_BASE_PATH: https://${{ steps.preview_config.outputs.preview_domain }}
        run: |
          # ENVIRONMENT lives inline — filter it so a repo var can't override it.
          # BASE_PATH override so OG / canonicals point at the preview, not the parent flavor.
          json=$(printf '%s' "$ALL_VARS" | jq -c \
            --arg base "$PREVIEW_BASE_PATH" \
            'with_entries(select((.key | startswith("NEXT_PUBLIC_")) and .key != "NEXT_PUBLIC_ENVIRONMENT")) + {NEXT_PUBLIC_BASE_PATH: $base}')
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -backend-config=${{ env.TERRAFORM_BACKEND_CONFIG }}

      - name: Terraform Workspace
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          WORKSPACE_NAME="preview-pr-${{ needs.setup.outputs.pr_number }}-${{ matrix.flavor }}"
          terraform workspace select ${WORKSPACE_NAME} || terraform workspace new ${WORKSPACE_NAME}

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          TF_VAR_next_public_env_vars: ${{ steps.next_public.outputs.json }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        # No TF_VAR here — the plan file already captured the variable value.
        # Passing it again on apply triggers "Can't change variable when applying
        # a saved plan file" even if the value is unchanged.
        run: terraform apply -auto-approve tfplan

      - name: Get deployment URL
        working-directory: ${{ env.TERRAFORM_DIR }}
        id: outputs
        run: |
          CUSTOM_URL=$(terraform output -raw custom_domain_url 2>/dev/null || echo "")
          SERVICE_URL=$(terraform output -raw service_url 2>/dev/null || echo "")
          echo "custom_url=${CUSTOM_URL}" >> $GITHUB_OUTPUT
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Save URLs for flavor
        id: save-urls
        run: |
          FLAVOR="${{ matrix.flavor }}"
          echo "custom_url_${FLAVOR}=${{ steps.outputs.outputs.custom_url }}" >> $GITHUB_OUTPUT
          echo "service_url_${FLAVOR}=${{ steps.outputs.outputs.service_url }}" >> $GITHUB_OUTPUT
          echo "status_${FLAVOR}=success" >> $GITHUB_OUTPUT

  # Same check names as deploy, but instant success when preview is not needed
  deploy-skip:
    name: Deploy Preview (${{ matrix.flavor }})
    needs: [setup, preview-relevant]
    if: needs.preview-relevant.outputs.run_preview != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [staging, beta]
      fail-fast: false
    steps:
      - name: Skip deploy (no relevant changes)
        run: echo "::notice::No frontend / preview infra changes in this PR - skipping Terraform preview deploy."

  # Update comment with final results
  comment-result:
    name: Update PR Comment
    needs: [setup, preview-relevant, verify-image, verify-image-skip, deploy, deploy-skip]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update PR comment - no deploy (docs / CI only)
        if: needs.preview-relevant.outputs.run_preview != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLAVORS: ${{ needs.setup.outputs.flavors }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        with:
          script: |
            function parseFlavors(raw) {
              if (!raw || String(raw).trim() === '') return ['staging', 'beta'];
              try {
                return JSON.parse(raw);
              } catch {
                return ['staging', 'beta'];
              }
            }
            const flavors = parseFlavors(process.env.FLAVORS);
            const prNumber = process.env.PR_NUMBER;
            const shortSha = process.env.SHORT_SHA;
            const projectName = process.env.PROJECT_NAME;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;
            let rows = '';
            for (const flavor of flavors) {
              rows += `| **${flavor}** | ⏭️ Skipped (no app or preview-infra changes) ([${shortSha}](${commitUrl})) | — | — |\n`;
            }
            const commentBody = [
              `## ${projectName} – Preview`,
              '',
              '| Name | Status | Preview | Updated (UTC) |',
              '|------|--------|---------|---------------|',
              rows.trim(),
              '',
              '---',
              `<sub>Checks passed without building - PR does not touch \`apps/**\`, \`packages/**\`, \`terraform/**\`, or root build files.</sub>`
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
            });
            const existingComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes(`${projectName} – Preview`)
            );
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: commentBody
              });
            }

      - name: Update PR comment - Results
        if: needs.preview-relevant.outputs.run_preview == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FLAVORS: ${{ needs.setup.outputs.flavors }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          RUN_URL: ${{ needs.setup.outputs.run_url }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          # Pass all possible URL and status outputs
          CUSTOM_URL_STAGING: ${{ needs.deploy.outputs.custom_url_staging }}
          SERVICE_URL_STAGING: ${{ needs.deploy.outputs.service_url_staging }}
          STATUS_STAGING: ${{ needs.deploy.outputs.status_staging }}
          CUSTOM_URL_BETA: ${{ needs.deploy.outputs.custom_url_beta }}
          SERVICE_URL_BETA: ${{ needs.deploy.outputs.service_url_beta }}
          STATUS_BETA: ${{ needs.deploy.outputs.status_beta }}
          # Overall job results (for detecting if deploy was skipped due to build failure)
          BUILD_RESULT: ${{ needs.verify-image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            function parseFlavors(raw) {
              if (!raw || String(raw).trim() === '') return ['staging', 'beta'];
              try {
                return JSON.parse(raw);
              } catch {
                return ['staging', 'beta'];
              }
            }
            const flavors = parseFlavors(process.env.FLAVORS);
            const prNumber = process.env.PR_NUMBER;
            const shortSha = process.env.SHORT_SHA;
            const runUrl = process.env.RUN_URL;
            const projectName = process.env.PROJECT_NAME;
            const buildResult = process.env.BUILD_RESULT;
            const deployResult = process.env.DEPLOY_RESULT;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.payload.pull_request.head.sha}`;

            // Get URLs and status for each flavor
            const flavorData = {
              staging: {
                custom: process.env.CUSTOM_URL_STAGING || '',
                service: process.env.SERVICE_URL_STAGING || '',
                status: process.env.STATUS_STAGING || ''
              },
              beta: {
                custom: process.env.CUSTOM_URL_BETA || '',
                service: process.env.SERVICE_URL_BETA || '',
                status: process.env.STATUS_BETA || ''
              }
            };

            let rows = '';
            let hasFailure = false;
            let hasSuccess = false;

            for (const flavor of flavors) {
              const data = flavorData[flavor] || { custom: '', service: '', status: '' };
              const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
              
              const flavorDeploySucceeded = data.status === 'success';
              
              if (buildResult === 'failure') {
                hasFailure = true;
                rows += `| **${flavor}** | ❌ Build Failed ([${shortSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${timestamp} |\n`;
              } else if (!flavorDeploySucceeded && deployResult === 'failure') {
                // Deploy job ran but this flavor failed
                hasFailure = true;
                rows += `| **${flavor}** | ❌ Deploy Failed ([${shortSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${timestamp} |\n`;
              } else if (flavorDeploySucceeded) {
                // This flavor deployed successfully
                hasSuccess = true;
                let previewLinks = '';
                if (data.custom && data.service) {
                  previewLinks = `[Custom Domain →](${data.custom}) • [Default URL →](${data.service})`;
                } else if (data.custom) {
                  previewLinks = `[Custom Domain →](${data.custom})`;
                } else if (data.service) {
                  previewLinks = `[Default URL →](${data.service})`;
                } else {
                  previewLinks = `[View Logs →](${runUrl})`;
                }
                rows += `| **${flavor}** | ✅ Ready ([${shortSha}](${commitUrl})) | ${previewLinks} | ${timestamp} |\n`;
              } else {
                rows += `| **${flavor}** | ⚠️ Unknown ([${shortSha}](${commitUrl})) | [View Logs →](${runUrl}) | ${timestamp} |\n`;
              }
            }

            let statusNote = '';
            if (hasSuccess) {
              statusNote = '\n\n> ⏱️ **Note:** Custom domains may take 5-10 minutes to activate on first deployment. Use Default URL in the meantime.';
            }

            let footerNote = hasFailure 
              ? `<sub>Deployment failed for commit ${shortSha} • [Check logs](${runUrl}) for details</sub>`
              : `<sub>Built with commit ${shortSha} • Preview environments are automatically destroyed when PRs are closed</sub>`;

            const commentBody = [
              `## ${projectName} – Preview`,
              '',
              '| Name | Status | Preview | Updated (UTC) |',
              '|------|--------|---------|---------------|',
              rows.trim(),
              statusNote,
              '',
              '---',
              footerNote
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(prNumber),
            });

            const existingComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes(`${projectName} – Preview`)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: commentBody
              });
            }

      - name: Deployment summary
        if: needs.preview-relevant.outputs.run_preview == 'true'
        env:
          FLAVORS: ${{ needs.setup.outputs.flavors }}
          PR_NUMBER: ${{ needs.setup.outputs.pr_number }}
          CUSTOM_URL_STAGING: ${{ needs.deploy.outputs.custom_url_staging }}
          SERVICE_URL_STAGING: ${{ needs.deploy.outputs.service_url_staging }}
          STATUS_STAGING: ${{ needs.deploy.outputs.status_staging }}
          CUSTOM_URL_BETA: ${{ needs.deploy.outputs.custom_url_beta }}
          SERVICE_URL_BETA: ${{ needs.deploy.outputs.service_url_beta }}
          STATUS_BETA: ${{ needs.deploy.outputs.status_beta }}
        run: |
          echo "### Preview Environments Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ needs.setup.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Flavor | Status | Custom Domain | Default URL |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|---------------|-------------|" >> $GITHUB_STEP_SUMMARY
          for flavor in $(echo '${{ needs.setup.outputs.flavors }}' | jq -r '.[]'); do
            CUSTOM_VAR="CUSTOM_URL_$(echo $flavor | tr '[:lower:]' '[:upper:]')"
            SERVICE_VAR="SERVICE_URL_$(echo $flavor | tr '[:lower:]' '[:upper:]')"
            STATUS_VAR="STATUS_$(echo $flavor | tr '[:lower:]' '[:upper:]')"
            CUSTOM_URL="${!CUSTOM_VAR}"
            SERVICE_URL="${!SERVICE_VAR}"
            STATUS="${!STATUS_VAR}"
            if [ "$STATUS" = "success" ]; then
              echo "| ${flavor} | ✅ Success | ${CUSTOM_URL:-N/A} | ${SERVICE_URL:-N/A} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${flavor} | ❌ Failed | N/A | N/A |" >> $GITHUB_STEP_SUMMARY
            fi
          done
