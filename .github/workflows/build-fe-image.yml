name: Build frontend image

# Content-addressed build. Pushes one image per commit to GHCR under two
# tags: the commit SHA (canonical — what deploy workflows pin) and the
# semver tag when a v.* push is at HEAD (alias). Skip-on-existence: if
# the SHA tag is already in GHCR, we only alias the semver tag onto it
# instead of rebuilding.
#
# Triggers on PR pushes (so preview deploys have an image ready when
# someone adds the create-preview label), on main pushes, and on v.* tag
# pushes. Deploy workflows never build — they promote from GHCR to ECR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v.*']

concurrency:
  group: build-fe-image-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      # Empty for non-tag events; set to v.X.Y.Z on tag pushes.
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v.') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Probe GHCR for image at SHA
        id: probe
        run: |
          if docker buildx imagetools inspect "${GHCR_IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SHA ${SHA_TAG} already in GHCR — no rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "SHA ${SHA_TAG} not in GHCR — will build."
          fi

      - name: Alias SHA → VERSION (no rebuild)
        if: steps.probe.outputs.exists == 'true' && env.VERSION_TAG != ''
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION_TAG}" \
            "${GHCR_IMAGE}:${SHA_TAG}"

      - name: Build image (load, no push)
        if: steps.probe.outputs.exists == 'false'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_IMAGE }}:${{ env.SHA_TAG }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Scan image with Trivy
        id: trivy
        if: steps.probe.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}:${{ env.SHA_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-report.json
          vuln-type: os,library

      - name: Render Trivy findings
        if: always() && steps.trivy.conclusion != 'skipped'
        run: |
          set -euo pipefail
          [ -f trivy-report.json ] || { echo "No Trivy report."; exit 0; }
          jq -r '
            def rows:
              [ .Results[]?
                | select(.Vulnerabilities and (.Vulnerabilities|length > 0))
                | . as $r
                | .Vulnerabilities[]
                | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \($r.Target) |"
              ];
            if (rows | length) == 0 then
              "No HIGH/CRITICAL vulnerabilities with upstream fixes."
            else
              "| Severity | Package | Installed | Fixed | CVE | Target |\n|---|---|---|---|---|---|\n" + (rows | join("\n"))
            end
          ' trivy-report.json > trivy-findings.md
          echo "--- Trivy findings ---"
          cat trivy-findings.md
          {
            echo "### Trivy scan"
            echo ""
            cat trivy-findings.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment scan failure on PR
        if: failure() && steps.trivy.conclusion == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "### Frontend image blocked by Trivy"
            echo ""
            echo "HIGH/CRITICAL vulnerabilities with upstream fixes were found. Image was **not** pushed to GHCR."
            echo ""
            cat trivy-findings.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Push image
        if: steps.probe.outputs.exists == 'false'
        run: |
          set -euo pipefail
          docker push "${GHCR_IMAGE}:${SHA_TAG}"
          if [ -n "${VERSION_TAG}" ]; then
            docker tag "${GHCR_IMAGE}:${SHA_TAG}" "${GHCR_IMAGE}:${VERSION_TAG}"
            docker push "${GHCR_IMAGE}:${VERSION_TAG}"
          fi

      - name: Summary
        env:
          ACTION: ${{ steps.probe.outputs.exists == 'true' && (env.VERSION_TAG != '' && 'aliased' || 'skipped') || 'built' }}
        run: |
          {
            echo "### Frontend image (${ACTION})"
            echo ""
            echo "- \`${GHCR_IMAGE}:${SHA_TAG}\`"
            if [ -n "${VERSION_TAG}" ]; then
              echo "- \`${GHCR_IMAGE}:${VERSION_TAG}\` → \`${GHCR_IMAGE}:${SHA_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
