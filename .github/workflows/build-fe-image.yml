name: Build frontend image

# Content-addressed build. Pushes one image per content hash to GHCR as
# `content.<hash>` (canonical — what deploy workflows pin), plus the semver
# tag when a v.* push is at HEAD (alias). The hash covers only the image's
# build inputs (.github/scripts/image-content-hash.sh), so it survives squash
# merges: the image a PR built is reused on main and by every deploy.
# Skip-on-existence: if the content tag is already in GHCR, we only alias the
# semver tag onto it instead of rebuilding.
#
# Every new build is scanned by Trivy before it is pushed; a HIGH/CRITICAL
# finding with an upstream fix blocks the push.
#
# Triggers on PR pushes (so preview deploys have an image ready when
# someone adds the create-preview label), on main pushes, and on v.* tag
# pushes. Deploy workflows never build — they promote from GHCR to ECR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v.*']

concurrency:
  group: build-fe-image-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      # Empty for non-tag events; set to v.X.Y.Z on tag pushes.
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v.') && github.ref_name || '' }}
      # Fork PRs get a read-only token: scan only, never push.
      CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Compute content tag
        run: echo "CONTENT_TAG=content.$(.github/scripts/image-content-hash.sh frontend)" >> "$GITHUB_ENV"

      - name: GHCR login
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Probe GHCR for image at content tag
        id: probe
        run: |
          if docker buildx imagetools inspect "${GHCR_IMAGE}:${CONTENT_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${CONTENT_TAG} already in GHCR — no rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${CONTENT_TAG} not in GHCR — will build."
          fi

      - name: Alias CONTENT → VERSION (no rebuild)
        if: steps.probe.outputs.exists == 'true' && env.VERSION_TAG != ''
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION_TAG}" \
            "${GHCR_IMAGE}:${CONTENT_TAG}"

      - name: Build image (load, no push)
        if: steps.probe.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_IMAGE }}:${{ env.CONTENT_TAG }}
          # No registry cache: on lockfile changes it never hit, and exporting
          # it cost ~90s per build.

      - name: Scan image with Trivy
        id: trivy
        if: steps.probe.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}:${{ env.CONTENT_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-report.json
          vuln-type: os,library

      - name: Render Trivy findings
        if: always() && steps.trivy.conclusion != 'skipped'
        run: |
          set -euo pipefail
          [ -f trivy-report.json ] || { echo "No Trivy report."; exit 0; }
          jq -r '
            def rows:
              [ .Results[]?
                | select(.Vulnerabilities and (.Vulnerabilities|length > 0))
                | . as $r
                | .Vulnerabilities[]
                | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \($r.Target) |"
              ];
            if (rows | length) == 0 then
              "No HIGH/CRITICAL vulnerabilities with upstream fixes."
            else
              "| Severity | Package | Installed | Fixed | CVE | Target |\n|---|---|---|---|---|---|\n" + (rows | join("\n"))
            end
          ' trivy-report.json > trivy-findings.md
          echo "--- Trivy findings ---"
          cat trivy-findings.md
          {
            echo "### Trivy scan"
            echo ""
            cat trivy-findings.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment scan failure on PR
        if: failure() && steps.trivy.conclusion == 'failure' && github.event_name == 'pull_request' && env.CAN_PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "### Frontend image blocked by Trivy"
            echo ""
            echo "HIGH/CRITICAL vulnerabilities with upstream fixes were found. Image was **not** pushed to GHCR."
            echo ""
            cat trivy-findings.md
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Push image
        if: steps.probe.outputs.exists == 'false' && env.CAN_PUSH == 'true'
        run: |
          set -euo pipefail
          docker push "${GHCR_IMAGE}:${CONTENT_TAG}"
          if [ -n "${VERSION_TAG}" ]; then
            docker tag "${GHCR_IMAGE}:${CONTENT_TAG}" "${GHCR_IMAGE}:${VERSION_TAG}"
            docker push "${GHCR_IMAGE}:${VERSION_TAG}"
          fi

      - name: Summary
        env:
          ACTION: ${{ steps.probe.outputs.exists == 'true' && (env.VERSION_TAG != '' && 'aliased' || 'skipped') || (env.CAN_PUSH == 'true' && 'built' || 'scanned (fork, not pushed)') }}
        run: |
          {
            echo "### Frontend image (${ACTION})"
            echo ""
            echo "- \`${GHCR_IMAGE}:${CONTENT_TAG}\`"
            if [ -n "${VERSION_TAG}" ]; then
              echo "- \`${GHCR_IMAGE}:${VERSION_TAG}\` → \`${GHCR_IMAGE}:${CONTENT_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
