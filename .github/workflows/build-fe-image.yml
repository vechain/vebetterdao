name: Build frontend image

# Content-addressed build. Pushes one image per commit to GHCR under two
# tags: the commit SHA (canonical — what deploy workflows pin) and the
# semver tag when a v.* push is at HEAD (alias). Skip-on-existence: if
# the SHA tag is already in GHCR, we only alias the semver tag onto it
# instead of rebuilding.
#
# Triggers on PR pushes (so preview deploys have an image ready when
# someone adds the create-preview label), on main pushes, and on v.* tag
# pushes. Deploy workflows never build — they promote from GHCR to ECR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ['v.*']

concurrency:
  group: build-fe-image-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      # Empty for non-tag events; set to v.X.Y.Z on tag pushes.
      VERSION_TAG: ${{ startsWith(github.ref, 'refs/tags/v.') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Probe GHCR for image at SHA
        id: probe
        run: |
          if docker buildx imagetools inspect "${GHCR_IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SHA ${SHA_TAG} already in GHCR — no rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "SHA ${SHA_TAG} not in GHCR — will build."
          fi

      - name: Alias SHA → VERSION (no rebuild)
        if: steps.probe.outputs.exists == 'true' && env.VERSION_TAG != ''
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION_TAG}" \
            "${GHCR_IMAGE}:${SHA_TAG}"

      - name: Compute build tags
        id: tags
        if: steps.probe.outputs.exists == 'false'
        run: |
          set -euo pipefail
          tags="${GHCR_IMAGE}:${SHA_TAG}"
          if [ -n "${VERSION_TAG}" ]; then
            tags="${tags}"$'\n'"${GHCR_IMAGE}:${VERSION_TAG}"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push (SHA${{ env.VERSION_TAG != '' && ' + VERSION' || '' }})
        if: steps.probe.outputs.exists == 'false'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Summary
        env:
          ACTION: ${{ steps.probe.outputs.exists == 'true' && (env.VERSION_TAG != '' && 'aliased' || 'skipped') || 'built' }}
        run: |
          {
            echo "### Frontend image (${ACTION})"
            echo ""
            echo "- \`${GHCR_IMAGE}:${SHA_TAG}\`"
            if [ -n "${VERSION_TAG}" ]; then
              echo "- \`${GHCR_IMAGE}:${VERSION_TAG}\` → \`${GHCR_IMAGE}:${SHA_TAG}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
