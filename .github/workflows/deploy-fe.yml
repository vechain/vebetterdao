name: Deploy Frontend

# Consolidated deploy workflow. Never builds — verifies the SHA image
# exists in GHCR (built by build-fe-image.yml), promotes it to the
# target env's ECR, then terraform applies. Tag push fans out to
# [staging, beta]; release publish → prod; workflow_dispatch is the
# only path for dev, and break-glass for staging/beta/prod.

on:
  push:
    tags: ['v.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options: [dev, staging, beta, prod]
      terraform_action:
        description: 'Terraform action'
        required: false
        default: 'deploy'
        type: choice
        options: [dry-run, deploy]

run-name: |
  Deploy ${{ github.event.release.tag_name || github.ref_name }} → ${{ github.event_name == 'release' && 'prod' || (inputs.target_env || 'staging+beta') }}${{ github.event_name == 'workflow_dispatch' && inputs.target_env != 'dev' && ' [BREAK-GLASS]' || '' }}

permissions: {}

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: governance-frontend
  TERRAFORM_VERSION: 1.10.0
  TERRAFORM_DIR: terraform/frontend/frontend-env-level
  TERRAFORM_ENV_DIR: terraform/frontend/environments/env

jobs:
  derive:
    name: Derive targets
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.plan.outputs.envs }}
      sha: ${{ steps.plan.outputs.sha }}
      version_tag: ${{ steps.plan.outputs.version_tag }}
    steps:
      - name: Derive envs, SHA, version tag
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_ENV: ${{ inputs.target_env }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              # tag push: v.X.Y.Z → deploy to staging + beta
              if [[ ! "$REF_NAME" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Tag '$REF_NAME' does not match v.MAJOR.MINOR.PATCH."
                exit 1
              fi
              envs='["staging","beta"]'
              version_tag="$REF_NAME"
              ;;
            release)
              # published: v.X.Y.Z → deploy to prod
              if [[ ! "$RELEASE_TAG" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Release tag '$RELEASE_TAG' does not match v.MAJOR.MINOR.PATCH."
                exit 1
              fi
              envs='["prod"]'
              version_tag="$RELEASE_TAG"
              ;;
            workflow_dispatch)
              envs="[\"${INPUT_ENV}\"]"
              # v.* if the dispatch ref is a version tag, empty otherwise
              if [[ "$REF_NAME" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                version_tag="$REF_NAME"
              else
                version_tag=""
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac
          echo "envs=${envs}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying to ${envs}, SHA=${GITHUB_SHA}, version=${version_tag:-<none>}"

  verify-image:
    name: Verify GHCR image
    needs: [derive]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ needs.derive.outputs.sha }}
    steps:
      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Wait for GHCR image at SHA
        run: |
          set -euo pipefail
          # build-fe-image.yml may still be running for the same commit.
          # Wait up to 15 minutes for the SHA tag to appear.
          for attempt in $(seq 1 30); do
            if docker buildx imagetools inspect "${GHCR_IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
              echo "Found ${GHCR_IMAGE}:${SHA_TAG} on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}/30: ${GHCR_IMAGE}:${SHA_TAG} not present yet; sleeping 30s..."
            sleep 30
          done
          echo "::error::Timed out after 15 minutes waiting for ${GHCR_IMAGE}:${SHA_TAG}. build-fe-image.yml may have failed — deploy will not build on demand."
          exit 1

  deploy:
    name: Deploy → ${{ matrix.env }}
    needs: [derive, verify-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.derive.outputs.envs) }}
    environment:
      name: ${{ matrix.env }}
    concurrency:
      group: deploy-fe-${{ matrix.env }}
      cancel-in-progress: false
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}-frontend
      SHA_TAG: ${{ needs.derive.outputs.sha }}
      VERSION_TAG: ${{ needs.derive.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize GHCR_IMAGE to lowercase
        run: echo "GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ matrix.env == 'prod' && secrets.AWS_ACCESS_ROLE || secrets.DEV_AWS_ACC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote GHCR → ECR (SHA${{ needs.derive.outputs.version_tag != '' && ' + VERSION' || '' }})
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          copy_from_sha() {
            local target_tag="$1"
            if aws ecr describe-images \
                --repository-name "${ECR_REPOSITORY}" \
                --image-ids "imageTag=${target_tag}" >/dev/null 2>&1; then
              echo "ECR ${ECR_IMAGE}:${target_tag} already present — skipping."
              return
            fi
            echo "Copying ${GHCR_IMAGE}:${SHA_TAG} → ${ECR_IMAGE}:${target_tag}"
            docker buildx imagetools create \
              --tag "${ECR_IMAGE}:${target_tag}" \
              "${GHCR_IMAGE}:${SHA_TAG}"
          }

          copy_from_sha "${SHA_TAG}"
          if [ -n "${VERSION_TAG}" ]; then
            copy_from_sha "${VERSION_TAG}"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Update env config with image tag
        env:
          ENVIRONMENT: ${{ matrix.env }}
        run: |
          # Pin App Runner to the SHA-tagged image. VERSION tag exists in
          # ECR too (via promote step) but SHA is the canonical identifier
          # — one image, one tag, one deployed version.
          CONFIG_FILE="${TERRAFORM_ENV_DIR}/${ENVIRONMENT}/${ENVIRONMENT}.yaml"
          sed -i "s/^image_tag:.*/image_tag: ${SHA_TAG}/" "${CONFIG_FILE}"

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ENVIRONMENT: ${{ matrix.env }}
        run: terraform init -backend-config=../environments/env/${ENVIRONMENT}/backend.config

      - name: Terraform Workspace
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ENVIRONMENT: ${{ matrix.env }}
        run: terraform workspace select "${ENVIRONMENT}" || terraform workspace new "${ENVIRONMENT}"

      - name: Collect NEXT_PUBLIC_* runtime env vars
        id: next_public
        env:
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          # ENVIRONMENT lives inline — filter it so a repo var can't override it.
          json=$(printf '%s' "$ALL_VARS" | jq -c 'with_entries(select((.key | startswith("NEXT_PUBLIC_")) and .key != "NEXT_PUBLIC_ENVIRONMENT"))')
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          TF_VAR_next_public_env_vars: ${{ steps.next_public.outputs.json }}
          TF_VAR_app_version: ${{ env.VERSION_TAG }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: (inputs.terraform_action || 'deploy') == 'deploy'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Deployment summary
        if: (inputs.terraform_action || 'deploy') == 'deploy'
        working-directory: ${{ env.TERRAFORM_DIR }}
        env:
          ENVIRONMENT: ${{ matrix.env }}
        run: |
          set -euo pipefail
          CUSTOM_URL=$(terraform output -raw custom_domain_url 2>/dev/null || echo "")
          SERVICE_URL=$(terraform output -raw service_url 2>/dev/null || echo "")
          {
            echo "### Deployed to \`${ENVIRONMENT}\`"
            echo ""
            echo "- Image: \`${SHA_TAG}\`"
            if [ -n "${VERSION_TAG}" ]; then
              echo "- Version: \`${VERSION_TAG}\`"
            fi
            if [ -n "${CUSTOM_URL}" ]; then
              echo "- URL: ${CUSTOM_URL}"
            else
              echo "- URL: ${SERVICE_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  create-release:
    name: Create GitHub release
    needs: [derive, deploy]
    # Only after a successful staging+beta deploy triggered by a tag push,
    # create the release (as a draft so it must be explicitly published to
    # trigger the prod deploy). The new draft supersedes any earlier drafts
    # so there is exactly one unpublished release waiting for prod.
    if: |
      github.event_name == 'push' &&
      needs.derive.outputs.version_tag != '' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.derive.outputs.version_tag }}
    steps:
      - name: Supersede existing draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tags are kept (no --cleanup-tag); published releases are untouched.
          gh release list --repo "${REPO}" --limit 100 \
            --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' \
          | while read -r tag; do
              [ -n "${tag}" ] || continue
              [ "${tag}" != "${VERSION_TAG}" ] || continue
              echo "Deleting superseded draft release ${tag}"
              gh release delete "${tag}" --repo "${REPO}" --yes
            done

      - name: Create draft release if not present
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${VERSION_TAG} already exists — skipping."
            exit 0
          fi
          latest=$(gh release view --repo "${REPO}" --json tagName --jq '.tagName' 2>/dev/null || echo "")
          gh release create "${VERSION_TAG}" \
            --repo "${REPO}" \
            --title "Release ${VERSION_TAG}" \
            --draft \
            --generate-notes \
            ${latest:+--notes-start-tag "${latest}"}
