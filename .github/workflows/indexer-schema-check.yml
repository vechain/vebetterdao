name: Indexer Schema Drift Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Regenerate + diff schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Regenerate schema (retry on transient indexer outages)
        run: |
          attempt=1
          max=3
          until yarn workspace frontend generate:schema; do
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::generate:schema failed after ${max} attempts — mainnet indexer may be unreachable"
              exit 1
            fi
            attempt=$((attempt+1))
            sleep 30
          done

      - name: Fail if schema drifted
        run: |
          if ! git diff --exit-code apps/frontend/src/api/indexer/schema.d.ts; then
            echo "::error::Indexer schema is out of date. Run 'yarn workspace frontend generate:schema' locally and commit the updated file."
            exit 1
          fi
